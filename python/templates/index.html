<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El Juego del Destino</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <main class="contenedor-principal">

        <header class="cabecera-juego">

            <div class="simbolo-cabecera">
                <i class="fa-solid fa-moon"></i>
            </div>

            <h1>El Juego del Destino</h1>

            <p class="texto-introduccion">
                Descubre qué te depara el futuro
            </p>

        </header>


        <form action="/enviar" method="POST" class="formulario-destino">

            <div class="campo-formulario">

                <div class="zona-entrada">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        name="nombre"
                        placeholder="Tu nombre"
                        required
                    >

                </div>

            </div>


            <div class="campo-formulario">

                <div class="zona-entrada">

                    <i class="fa-solid fa-calendar-days"></i>

                    <input
                        type="number"
                        name="edad"
                        placeholder="Tu edad"
                        required
                    >

                </div>

            </div>


            <div class="campo-formulario">

                <div class="zona-entrada">

                    <i class="fa-solid fa-globe"></i>

                    <input
                        type="text"
                        name="color"
                        placeholder="Tu color favorito"
                        required
                    >

                </div>

                <small class="ayuda-campo">
                    Ej. rojo, azul, verde, morado, amarillo...
                </small>

            </div>


            <div class="campo-formulario">

                <div class="zona-entrada">

                    <i class="fa-solid fa-paw"></i>

                    <input
                        type="text"
                        name="animal"
                        placeholder="Tu animal favorito"
                        required
                    >

                </div>

                <small class="ayuda-campo">
                    Ej. perro, gato, águila, león, delfín...
                </small>

            </div>


            <div class="contenedor-esfera">

                <div class="esfera-magica"></div>

            </div>


            <button type="submit" class="boton-principal">

                <i class="fa-solid fa-pen"></i>

                Revelar mi destino

            </button>

        </form>

    </main>

</body>
</html>
